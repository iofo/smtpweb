name: Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Repo-wide default: read-only. Neither job needs to write to the repo,
# open issues/PRs, etc. `publish` additionally grants itself
# packages: write below, scoped to just that job.
permissions:
  contents: read

jobs:
  # Runs on every push AND every pull_request, including from forks —
  # deliberately never references `secrets.*` anywhere in this job, so
  # there is nothing here for a malicious PR to steal. (GitHub also
  # withholds secrets from pull_request-triggered runs whose head is a
  # fork by default, but this job doesn't rely on that — it simply never
  # asks for them.)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build test image
        run: docker build --target test -t smtpweb:test .

      - name: Run tests
        run: docker run --rm smtpweb:test

      - name: Build lint image
        run: docker build --target lint -t smtpweb:lint .

      - name: Run lint (ruff check + format --check)
        run: docker run --rm smtpweb:lint

  # Runs the *actual final image* (not the editable/test-stage install) as
  # two real containers on real ports, and drives it exactly the way a
  # user would: send mail in over SMTP AUTH+STARTTLS, read it back out
  # over the web API. Catches the class of bug the in-process TestClient
  # suite structurally can't — missing package-data, a broken CMD, TLS
  # cert generation failing at runtime, env var wiring — because those
  # only exist once the packaged image is actually running as itself.
  # Also never references `secrets.*`, for the same fork-PR reason as
  # the `test` job above.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build final image
        run: docker build --target final -t smtpweb:smoke .

      - name: Start smtp + web containers
        run: |
          docker volume create smoke-mail
          docker run -d --name smoke-smtp \
            -p 1025:1025 \
            -e SMTPWEB_SMTP_USERNAME=smoketest \
            -e SMTPWEB_SMTP_PASSWORD=smoketest-password \
            -v smoke-mail:/data/mail \
            smtpweb:smoke python -m smtpweb.smtp.main
          docker run -d --name smoke-web \
            -p 8080:8080 \
            -v smoke-mail:/data/mail \
            smtpweb:smoke python -m smtpweb.web.main

      - name: Wait for both containers to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sk -o /dev/null "https://127.0.0.1:8080/" && web_ready=1 || web_ready=0
            (echo > /dev/tcp/127.0.0.1/1025) 2>/dev/null && smtp_ready=1 || smtp_ready=0
            if [ "$web_ready" = 1 ] && [ "$smtp_ready" = 1 ]; then
              echo "both ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::containers never became ready"
          docker logs smoke-smtp
          docker logs smoke-web
          exit 1

      - name: Unauthenticated API access is rejected, not exposed
        run: |
          status=$(curl -sk -o /dev/null -w "%{http_code}" "https://127.0.0.1:8080/api/emails")
          test "$status" = "401" || { echo "expected 401, got $status"; exit 1; }

      - name: Send real mail over SMTP AUTH+STARTTLS
        run: |
          python3 scripts/send_test_emails.py \
            --username smoketest --password smoketest-password

      - name: Read it back over the web API
        run: |
          cookie_jar=$(mktemp)
          status=$(curl -sk -o /dev/null -w "%{http_code}" -c "$cookie_jar" \
            -X POST "https://127.0.0.1:8080/api/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"bob@example.com","password":"smoke-test-mailbox-password"}')
          test "$status" = "200" || { echo "login failed: $status"; exit 1; }

          body=$(curl -sk -b "$cookie_jar" "https://127.0.0.1:8080/api/emails")
          echo "$body" | python3 -c '
          import json, sys
          emails = json.load(sys.stdin)
          assert len(emails) >= 3, f"expected >=3 emails, got {len(emails)}"
          subjects = {e["subject"] for e in emails}
          assert "Plain text email" in subjects, subjects
          assert any(e["attachments"] for e in emails), "no email had attachments"
          print(f"OK: {len(emails)} emails visible, subjects={subjects}")
          '

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs smoke-smtp || true
          docker logs smoke-web || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f smoke-smtp smoke-web || true
          docker volume rm smoke-mail || true

  # Publishes to ghcr.io (GitHub Container Registry) using the workflow's
  # own GITHUB_TOKEN — generated fresh per run and expired by GitHub as
  # soon as the job ends, so there's no long-lived credential to manage,
  # rotate, or leak (unlike a static Docker Hub access token). This job
  # only ever runs when github.event_name == 'push' to the master branch
  # — never for pull_request events (fork or same-repo), so a PR can
  # never cause this job to execute regardless of what it changes,
  # including changes to this workflow file itself. Reaching this job
  # requires push access to the repository.
  publish:
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: final
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
