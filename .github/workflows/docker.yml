name: Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Repo-wide default: read-only. Neither job needs to write to the repo,
# open issues/PRs, etc. `publish` additionally grants itself
# packages: write below, scoped to just that job.
permissions:
  contents: read

jobs:
  # Runs on every push AND every pull_request, including from forks —
  # deliberately never references `secrets.*` anywhere in this job, so
  # there is nothing here for a malicious PR to steal. (GitHub also
  # withholds secrets from pull_request-triggered runs whose head is a
  # fork by default, but this job doesn't rely on that — it simply never
  # asks for them.)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build test image
        run: docker build --target test -t smtpweb:test .

      - name: Run tests
        run: docker run --rm smtpweb:test

      - name: Build lint image
        run: docker build --target lint -t smtpweb:lint .

      - name: Run lint (ruff check + format --check)
        run: docker run --rm smtpweb:lint

  # Publishes to ghcr.io (GitHub Container Registry) using the workflow's
  # own GITHUB_TOKEN — generated fresh per run and expired by GitHub as
  # soon as the job ends, so there's no long-lived credential to manage,
  # rotate, or leak (unlike a static Docker Hub access token). This job
  # only ever runs when github.event_name == 'push' to the master branch
  # — never for pull_request events (fork or same-repo), so a PR can
  # never cause this job to execute regardless of what it changes,
  # including changes to this workflow file itself. Reaching this job
  # requires push access to the repository.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: final
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
