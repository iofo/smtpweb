[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smtpweb"
version = "0.1.0"
description = "SMTP server that stores received emails on the filesystem, with a web UI to browse them."
requires-python = ">=3.10"
dependencies = [
    "aiosmtpd>=1.4.6",
    "cryptography>=42",
    "fastapi>=0.111",
    "pillow>=10",
    "pydantic>=2",
    "pypdfium2>=4",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]
lint = [
    "ruff>=0.16",
]

[project.scripts]
smtpweb-smtp = "smtpweb.smtp.main:run"
smtpweb-web = "smtpweb.web.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smtpweb = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixed-format PDF byte content — not reflowable without breaking the
# format's own byte offsets.
"tests/conftest.py" = ["E501"]
