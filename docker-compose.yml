services:
  smtp:
    build: .
    image: smtpweb:latest
    command: python -m smtpweb.smtp.main
    ports:
      - "1025:1025"
    volumes:
      - ./data/mail:/data/mail
      - ./data/smtp:/data/smtp
    restart: unless-stopped

  web:
    build: .
    image: smtpweb:latest
    command: python -m smtpweb.web.main
    ports:
      - "8080:8080"
    volumes:
      - ./data/mail:/data/mail
      - ./data/web:/data/web
    restart: unless-stopped
